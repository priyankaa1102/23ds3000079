name: Daily Commit

on:
  schedule:
    - cron: '15 4 * * *'  # Runs daily at 4:15 UTC
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Daily commit step by 23ds3000079@ds.study.iitm.ac.in
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Run on $(date -u)" >> daily-log.txt

          git add daily-log.txt
          git commit -m "Automated daily update at $(date -u)" || echo "No changes to commit"
          git push https://x-access-token:$TOKEN@github.com/${{ github.repository }}.git HEAD:main
