name: Daily Commit

on:
  schedule:
    - cron: '15 4 * * *'  # ⏰ Runs daily at 04:15 UTC
  workflow_dispatch:

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Daily commit step by 23ds3000079@ds.study.iitm.ac.in  # ✅ Required email in step name
        run: |
          echo "Daily update: $(date -u)" >> daily-log.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.txt
          git commit -m "Automated daily update"
          git push
